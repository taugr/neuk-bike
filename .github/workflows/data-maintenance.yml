name: Data maintenance

on:
  schedule:
    # Avoid the busy start of the hour; GitHub schedules are best-effort.
    - cron: '23 6 * * 5'
    # Allow the day's regional publications to finish before monthly preflight.
    - cron: '23 21 1 * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Download and build a complete data release for review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-maintenance
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    # Includes a bounded upstream wait and validated build within GitHub's
    # six-hour total job limit. This workflow never deploys.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build monthly or requested release
        if: github.event.schedule == '23 21 1 * *' || inputs.refresh == true
        run: pnpm refresh:data --wait-for-sources
      - name: Review current upstream publications (check-only run)
        if: github.event.schedule != '23 21 1 * *' && inputs.refresh != true
        run: pnpm check:data --upstream --wait-for-sources
      - name: Verify installed release source age (refresh run)
        if: github.event.schedule == '23 21 1 * *' || inputs.refresh == true
        run: pnpm check:data --output=.cache/review/installed-source-status.json
      - name: Summarize source check
        if: always()
        run: |
          if [ -f .cache/review/source-readiness.json ]; then
            {
              echo '## Upstream readiness'
              echo 'All configured sources must validate before a release is built. Waiting never publishes partial data.'
              echo '```json'
              cat .cache/review/source-readiness.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .cache/review/refresh-failure.json ]; then
            {
              echo '## Refresh failure'
              echo '```json'
              cat .cache/review/refresh-failure.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .cache/source-status.json ]; then
            {
              echo '## Source freshness check'
              echo 'Refresh reports describe pinned preflight publications; check-only reports inspect current upstream. This workflow does not deploy.'
              echo '```json'
              cat .cache/source-status.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package the reviewed changes
        if: github.event.schedule == '23 21 1 * *' || inputs.refresh == true
        run: |
          mkdir -p .cache/review
          git add --intent-to-add public/data src/data
          git diff --binary -- public/data src/data > .cache/review/data-refresh.patch
          tar -czf .cache/review/data-release.tar.gz public/data src/data/cycle-parking.json src/data/cycle-parking-report.json src/data/cycling-poi-report.json src/data/cycle-network-report.json src/data/data-freshness-summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-review-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .cache/source-status.json
            .cache/review/
          retention-days: 30
